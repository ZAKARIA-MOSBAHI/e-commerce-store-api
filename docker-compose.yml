version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app                 
      - /app/node_modules   
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/store
      - PORT=3000
    depends_on:
      - mongo
    command: npm run dev       

  mongo:
    image: mongo:6.0.27  
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=store

volumes:
  mongo-data: